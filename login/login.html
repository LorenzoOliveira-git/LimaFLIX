<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/img/iconeLimaFlix.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <div class="container">
        <a href="../index.html"><img src="../img/limaFLIX.png" alt="logo da Lima Flix" width="160px"></a>
        <div class="login">
            <h2>Faça seu login:</h2>
            <form action="">
                <div class="campo">
                    <label for="nome">Nome:</label>
                    <br>
                    <input type="text" name="nome" placeholder="Digite o seu nome">
                </div>
                <div class="campo">
                    <label for="email">E-mail:</label>
                    <br>
                    <input type="text" name="email" placeholder="Digite o seu e-mail">
                </div>
                <div class="campo">
                    <label for="senha">Senha:</label>
                    <br>
                    <input type="password" name="senha" placeholder="Digite sua senha">
                </div>
                <div class="campo">
                    <label for="confirmar_senha">Confirmar Senha:</label>
                    <br>
                    <input type="password" name="confirmar_senha" placeholder="Confirme a sua senha">
                </div>
            </form>
            <a href=""><button>Enviar</button></a>
        </div>
    </div>
</body>
</html>
